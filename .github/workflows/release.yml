name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build Windows artifacts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win portable nsis --publish never

      - name: Validate artifacts
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          $required = @(
            'dist/latest.yml',
            "dist/GitMonitor-Setup-$version.exe",
            "dist/GitMonitor-Setup-$version.exe.blockmap",
            'dist/GitMonitor-portable.exe'
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Artifact missing: $file"
            }
          }

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p upload
          cp dist/latest.yml upload/latest.yml
          cp "dist/GitMonitor-Setup-${version}.exe" upload/
          cp "dist/GitMonitor-Setup-${version}.exe.blockmap" upload/
          cp dist/GitMonitor-portable.exe upload/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: git-monitor-artifacts-${{ github.ref_name }}
          path: upload/*
          if-no-files-found: error
          retention-days: 7
